name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the shared build helper is unmodified
        run: cd scripts && shasum -a 256 -c clt-swift-env.sh.sha256
      - name: Verify core behavior
        run: ./scripts/verify_project.sh
      - name: Build app bundle
        run: ./scripts/build_app.sh
      - name: Verify bundle signature
        run: codesign --verify --deep --strict dist/CodexTouchBar.app
      - name: Upload unsigned app bundle
        uses: actions/upload-artifact@v4
        with:
          name: CodexTouchBar-unsigned
          path: dist/CodexTouchBar.app
          if-no-files-found: error
